name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  # Weekly, so a vulnerability published while nobody opens a pull request is still found (job Security checks)
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.14"]
        include:
          # Windows is the primary development platform
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: "**/pyproject.toml"

      - name: Install modules
        run: >
          python -m pip install
          -e "kinenix-core[dev]"
          -e "kinenix-worker[dev]"
          -e "kinenix-studio[dev]"
          -e "kinenix-hub[dev]"

      # Tests that use the chromium fixture drive a real browser against local pages; with CI=true they
      # fail instead of skipping when Chromium is missing (kinenix-core/tests/conftest.py)
      - name: Install Chromium for the browser tests
        run: python -m playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      # kinenix-core tests run from their own directory, the others from the repository root
      - name: Test kinenix-core
        working-directory: kinenix-core
        run: python -m pytest -q

      - name: Test kinenix-worker
        run: python -m pytest -q kinenix-worker/tests

      - name: Test kinenix-studio
        run: python -m pytest -q kinenix-studio/tests

      - name: Test kinenix-hub
        run: python -m pytest -q kinenix-hub/tests

  packages:
    name: Package build and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install build twine
          for package in kinenix-core kinenix-hub kinenix-worker; do
            python -m build --outdir dist "$package"
          done
          python -m twine check --strict dist/*
          python .github/scripts/check_release.py dist

      # Install the way a user would, in a clean environment, from the built files only
      - name: Install from the built files
        run: |
          python -m venv /tmp/clean
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"(.+)\"', pathlib.Path('kinenix-core/kinenix/__init__.py').read_text()).group(1))")
          /tmp/clean/bin/pip install --find-links dist "kinenix[hub,worker]==$version"

      - name: Smoke test the installed commands
        working-directory: /tmp
        run: |
          /tmp/clean/bin/kinenix --version
          /tmp/clean/bin/kinenix hub --help > /dev/null
          /tmp/clean/bin/kinenix-worker --version
          /tmp/clean/bin/python -c "import importlib.resources as r; assert r.files('kinenix_hub').joinpath('static/index.html').is_file(); print('dashboard files packaged')"

      # The quickstart path from the installed package: a new task project, and the hello example run end to end
      - name: Smoke test kinenix init
        working-directory: /tmp
        env:
          KINENIX_FLOWS_DIR: /tmp/flows
        run: |
          /tmp/clean/bin/kinenix init "Smoke task"
          test -f flows/smoke_task/requirements.md && test -f flows/smoke_task/.gitignore && test -f flows/smoke_task/.env.example
          /tmp/clean/bin/kinenix validate smoke_task
          /tmp/clean/bin/kinenix actions web > /dev/null
          /tmp/clean/bin/kinenix init --list
          /tmp/clean/bin/kinenix init smoke-bot --example hello
          /tmp/clean/bin/kinenix run smoke-bot
          grep -q "Hello, Somchai!" flows/smoke-bot/output/greetings.csv

  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the checkers
        run: python -m pip install pip-audit bandit zizmor

      # What a user gets from PyPI: the three published packages and their dependencies, without the dev tools
      - name: Dependencies with known vulnerabilities (pip-audit)
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install ./kinenix-core ./kinenix-hub ./kinenix-worker
          /tmp/audit/bin/pip freeze --exclude kinenix --exclude kinenix-hub --exclude kinenix-worker > /tmp/requirements.txt
          python -m pip_audit -r /tmp/requirements.txt --no-deps --disable-pip --progress-spinner off

      # Every finding is fixed, or explained next to the code with `# nosec <test id>: <reason>` (.agents/rules/security.md)
      - name: Static analysis of the published packages (bandit)
        run: python -m bandit -q -r kinenix-core/kinenix kinenix-hub/kinenix_hub kinenix-worker/kinenix_worker

      # The workflows themselves: actions pinned to a commit, no token left on the runner, no ${{ }} in scripts
      - name: GitHub Actions workflows (zizmor)
        run: zizmor --offline --min-severity medium .github/workflows

  studio-frontend:
    name: Studio frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kinenix-studio/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kinenix-studio/frontend/package-lock.json

      - run: npm ci

      - run: npm run build
